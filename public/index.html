<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mes tâches</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/app.css?v=6">
  <script>
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <div id="login" class="hidden">
    <form id="loginForm" autocomplete="on">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="currentColor"/><path d="M18 33l9 9 19-20" fill="none" stroke="var(--panel)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <h2>Connexion</h2>
      <p>Espace privé de suivi des tâches.</p>
      <input name="email" type="email" placeholder="Email" autocomplete="username" required>
      <input name="password" type="password" placeholder="Mot de passe" autocomplete="current-password" required>
      <button class="go" type="submit">Entrer</button>
      <div class="msg err hidden" id="loginErr"></div>
    </form>
  </div>

  <div id="app" class="hidden">
    <header class="nav">
      <a class="brand" href="#/">
        <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="currentColor"/><path d="M18 33l9 9 19-20" fill="none" stroke="var(--bg)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span><b>Mes tâches</b><small>Espace personnel</small></span>
      </a>
      <nav class="pill links">
        <a href="#/" data-route="">Tableau de bord</a>
        <a href="#/taches" data-route="taches">Tâches</a>
        <a href="#/admin" data-route="admin" id="adminLink" class="hidden">Admin</a>
      </nav>
      <div class="pill">
        <span class="who" id="who"></span>
        <button class="theme-toggle" id="themeBtn" title="Jour / nuit" aria-label="Basculer jour / nuit">
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button class="theme-toggle" id="logoutBtn" title="Se déconnecter" aria-label="Se déconnecter">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        </button>
      </div>
    </header>
    <main class="wrap" id="view"></main>
  </div>

  <dialog class="sheet" id="sheet"></dialog>
  <div class="toast" id="toast"></div>
  <script type="module" src="/app.js?v=6"></script>
</body>
</html>
